[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storybot"
version = "0.1.0"
description = "Story retrieval chatbot and genre classifier over FareedKhan/1k_stories_100_genre"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "qdrant-client[fastembed]>=1.12",
]

[project.optional-dependencies]
gpu = ["torch", "transformers>=4.48", "datasets", "accelerate"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
